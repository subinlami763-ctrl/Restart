  - name: Fix Mic, Audio, Wallpaper and Extra Smoothness
    run: |
     $ErrorActionPreference = "Continue"
     # ---- 1) Audio services (Windows Server me default band hoti hain => mic/speaker kaam nahi karta) ----
     foreach ($svc in "AudioEndpointBuilder", "Audiosrv") {
      try { Set-Service -Name $svc -StartupType Automatic -ErrorAction Stop; Start-Service -Name $svc -ErrorAction SilentlyContinue } catch { Write-Host "Audio svc fail: $svc" }
     }
     # ---- 2) RDP audio + mic redirection allow ----
     $tsp = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
     New-Item -Path $tsp -Force | Out-Null
     foreach ($n in "fDisableAudioCapture", "fDisableCam", "fDisableCdm", "fNoRemoteDesktopWallpaper") {
      Set-ItemProperty -Path $tsp -Name $n -Value 0 -Type DWord -Force
     }
     Set-ItemProperty -Path $tsp -Name "fDisableCdm" -Value 0 -Type DWord -Force
     $wsk = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
     foreach ($n in "fDisableAudioCapture", "fDisableAudio") {
      Set-ItemProperty -Path $wsk -Name $n -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
     }
     # ---- 3) Windows privacy: microphone access allow ----
     $cs = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone"
     New-Item -Path $cs -Force | Out-Null
     Set-ItemProperty -Path $cs -Name "Value" -Value "Allow" -Type String -Force
     $ap = "HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy"
     New-Item -Path $ap -Force | Out-Null
     Set-ItemProperty -Path $ap -Name "LetAppsAccessMicrophone" -Value 1 -Type DWord -Force
     Write-Host "Audio + mic redirection enabled."
     # ---- 4) Smoother RDP: AVC444 band (kam bandwidth), 60fps rakho ----
     Set-ItemProperty -Path $tsp -Name "AVC444ModePreferred" -Value 0 -Type DWord -Force
     Set-ItemProperty -Path $tsp -Name "VGOptimization_CaptureFrameRate" -Value 2 -Type DWord -Force
     # ---- 5) Security off (sirf is temporary VM ke liye, Tailscale ke peeche) ----
     try {
      $df = "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender"
      New-Item -Path "$df\Real-Time Protection" -Force | Out-Null
      Set-ItemProperty -Path $df -Name "DisableAntiSpyware" -Value 1 -Type DWord -Force
      Set-ItemProperty -Path "$df\Real-Time Protection" -Name "DisableRealtimeMonitoring" -Value 1 -Type DWord -Force
      $ss = "HKLM:\SOFTWARE\Policies\Microsoft\Windows\System"
      New-Item -Path $ss -Force | Out-Null
      Set-ItemProperty -Path $ss -Name "EnableSmartScreen" -Value 0 -Type DWord -Force
      Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "ConsentPromptBehaviorAdmin" -Value 0 -Type DWord -Force
      Write-Host "Defender policy off, SmartScreen off, UAC prompt off."
     } catch { Write-Host "Security off fail: $_" }
     # ---- 6) Extra background services band (RDP/audio/network ko touch nahi karte) ----
     foreach ($svc in "Spooler", "Fax", "XblAuthManager", "XblGameSave", "XboxNetApiSvc", "XboxGipSvc", "RetailDemo", "PhoneSvc", "lfsvc", "SharedAccess", "WMPNetworkSvc", "TrkWks") {
      try { Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue; Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue } catch {}
     }
     # ---- 7) Wallpaper har RDP login par apply karne wali script ----
     @'
     $ErrorActionPreference = "SilentlyContinue"
     Start-Sleep -Seconds 4
     $k = "HKCU:\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone"
     New-Item -Path $k -Force | Out-Null
     Set-ItemProperty -Path $k -Name "Value" -Value "Allow" -Type String -Force
     $wp = Get-ChildItem "C:\RDPData\wallpaper" -Filter "wall.*" | Select-Object -First 1
     if (-not $wp) { exit }
     $style = "10"; $tile = "0"
     if (Test-Path "C:\RDPData\wallpaper\settings.json") {
      $j = Get-Content "C:\RDPData\wallpaper\settings.json" -Raw | ConvertFrom-Json
      if ($j.style) { $style = "$($j.style)" }
      if ($j.tile) { $tile = "$($j.tile)" }
     }
     $d = "HKCU:\Control Panel\Desktop"
     Set-ItemProperty -Path $d -Name WallpaperStyle -Value $style
     Set-ItemProperty -Path $d -Name TileWallpaper -Value $tile
     Add-Type -TypeDefinition 'using System.Runtime.InteropServices; public class SnckWP { [DllImport("user32.dll", CharSet=CharSet.Auto)] public static extern int SystemParametersInfo(int a, int b, string c, int d); }'
     for ($i = 0; $i -lt 3; $i++) {
      [SnckWP]::SystemParametersInfo(20, 0, $wp.FullName, 3) | Out-Null
      Start-Sleep -Seconds 5
     }
     '@ | Set-Content -Path "C:\ProgramData\snck-wallpaper.ps1"
     Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" -Name "SnckWallpaper" -Value 'powershell.exe -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "C:\ProgramData\snck-wallpaper.ps1"'
     Write-Host "Wallpaper logon script ready."
     exit 0
  - name: Create RDP User (snck)
    run: |
     $user = $env:RDP_USER
     $pass = $env:RDP_PASS
     try {
      secedit /export /cfg C:\secpol.cfg | Out-Null
      (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0' | Set-Content C:\secpol.cfg
      secedit /configure /db C:\Windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY | Out-Null
     } catch { Write-Host "Password policy change fail: $_" }
     $securePass = ConvertTo-SecureString $pass -AsPlainText -Force
     if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
      Set-LocalUser -Name $user -Password $securePass
     } else {
      try {
       New-LocalUser -Name $user -Password $securePass -AccountNeverExpires -PasswordNeverExpires | Out-Null
      } catch {
       Write-Host "New-LocalUser fail ($_), net user se try kar rahe hain"
       net user $user "$pass" /add /y
      }
     }
     Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
     Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue
     if (-not (Get-LocalUser -Name $user -ErrorAction SilentlyContinue)) {
      Write-Error "User creation failed"
      exit 1
     }
     Write-Host "User '$user' ready."
  - name: Create Profile and Restore App Data
    run: |
     Add-Type -TypeDefinition @"
     using System;
     using System.Text;
     using System.Runtime.InteropServices;
     public class UserProf {
      [DllImport("userenv.dll", CharSet = CharSet.Unicode)]
      public static extern int CreateProfile(
       [MarshalAs(UnmanagedType.LPWStr)] string pszUserSid,
       [MarshalAs(UnmanagedType.LPWStr)] string pszUserName,
       [Out][MarshalAs(UnmanagedType.LPWStr)] StringBuilder pszProfilePath,
       uint cchProfilePath);
     }
     "@
     $sid = (Get-LocalUser -Name $env:RDP_USER).SID.Value
     Write-Host "RDP user SID: $sid"
     gh release download rdp-data --repo $env:GITHUB_REPOSITORY --pattern last-sid.txt --dir $env:TEMP --clobber 2>$null
     if (Test-Path "$env:TEMP\last-sid.txt") {
      $oldSid = (Get-Content "$env:TEMP\last-sid.txt" -Raw).Trim()
      if ($oldSid -eq $sid) { Write-Host "SID SAME HAI: saved login (Chrome/VS Code) chal sakte hain" }
      else { Write-Host "SID BADLA (purana $oldSid): Windows-encrypted login is machine par nahi chalega" }
     }
     Set-Content -Path "$env:TEMP\last-sid.txt" -Value $sid -NoNewline
     gh release upload rdp-data "$env:TEMP\last-sid.txt" --repo $env:GITHUB_REPOSITORY --clobber
     $sb  = New-Object System.Text.StringBuilder 260
     $hr  = [UserProf]::CreateProfile($sid, $env:RDP_USER, $sb, 260)
     Write-Host "CreateProfile result: $hr  path: $sb"
     $prof = $null
     try {
      $prof = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid").ProfileImagePath
     } catch {}
     if (-not $prof) {
      Write-Host "PROFILE NAHI BANA - AppData restore skip (varna login par galat profile ban sakta hai)"
      exit 0
     }
     Write-Host "Profile path: $prof"
     . "C:\persist-lib.ps1"
     # purane (legacy) archives pehle, phir naye per-app archives upar se overwrite karte hain
     foreach ($name in "appdata.tgz", "chrome.tgz", "brave.tgz", "shell.tgz", "fonts.tgz", "applocal.tgz", "approaming.tgz", "applow.tgz", "profile.tgz") {
      if (Restore-Archive $name $prof) { Write-Host "$name restore ho gaya." }
      else { Write-Host "$name abhi tak save nahi hua." }
     }
     $appNames = @(Get-AssetNames | ForEach-Object { $_ -replace '\.part\d+$', '' } | Where-Object { $_ -match '^(al|ar|ao)-.+\.tgz$' } | Sort-Object -Unique)
     foreach ($name in $appNames) {
      if (Restore-Archive $name $prof) { Write-Host "$name restore ho gaya." }
      else { Write-Host "$name restore nahi hua." }
     }
     try { Save-AppArchives $prof -SigOnly } catch { Write-Host "sig init fail: $_" }
     Write-Host "AppData\Local after restore: $((Get-ChildItem "$prof\AppData\Local" -Directory -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }) -join ', ')"
     try {
      $ErrorActionPreference = "Continue"
      gh release download rdp-data --repo $env:GITHUB_REPOSITORY --pattern settings.hiv --dir $env:TEMP --clobber 2>$null
      $hiv  = "$env:TEMP\settings.hiv"
      $hive = "$prof\NTUSER.DAT"
      if ((Test-Path $hiv) -and (Test-Path $hive)) {
       reg load HKU\RdpNew "$hive" | Out-Null
       reg load HKU\RdpOld "$hiv" | Out-Null
       $cv = "Software\Microsoft\Windows\CurrentVersion"
       $keys = @(
        "Control Panel", "Environment", "Keyboard Layout",
        "$cv\Themes", "$cv\Search", "$cv\Run", "$cv\Uninstall", "$cv\Policies",
        "$cv\Explorer\Advanced", "$cv\Explorer\Accent", "$cv\Explorer\StuckRects3",
        "$cv\Explorer\Taskband", "$cv\Explorer\CabinetState", "$cv\Explorer\HideDesktopIcons",
        "$cv\Explorer\Ribbon", "$cv\Explorer\StartPage", "$cv\Explorer\StartPage2",
        "Software\Microsoft\Windows\DWM", "Console", "Network", "Printers",
        "$cv\Explorer\FileExts", "$cv\Explorer\RecentDocs", "$cv\Explorer\TypedPaths",
        "$cv\Explorer\Wallpapers", "$cv\Explorer\VisualEffects", "$cv\Explorer\ComDlg32",
        "$cv\Explorer\Streams", "$cv\Applets", "$cv\Notifications\Settings",
        "Software\Microsoft\Windows NT\CurrentVersion\Fonts"
       )
       foreach ($k in $keys) {
        if (Test-Path -LiteralPath "Registry::HKEY_USERS\RdpOld\$k") {
         reg copy "HKU\RdpOld\$k" "HKU\RdpNew\$k" /s /f | Out-Null
        }
       }
       foreach ($v in @(Get-ChildItem "Registry::HKEY_USERS\RdpOld\Software" -ErrorAction SilentlyContinue)) {
        $vn = $v.PSChildName
        if ($vn -in "Microsoft", "Classes", "Policies", "Wow6432Node") { continue }
        reg copy "HKU\RdpOld\Software\$vn" "HKU\RdpNew\Software\$vn" /s /f | Out-Null
       }
       $msDeny = @("Windows", "Windows NT", "Cryptography", "SystemCertificates", "IdentityCRL", "Protected Storage System Provider", "Windows Defender", "Active Setup", "CTF", "Input", "InputPersonalization", "Personalization", "Multimedia", "MSF", "Speech", "SystemSettings", "Internet Explorer", "OneDrive", "WindowsRuntime")
       foreach ($v in @(Get-ChildItem "Registry::HKEY_USERS\RdpOld\Software\Microsoft" -ErrorAction SilentlyContinue)) {
        $vn = $v.PSChildName
        if ($msDeny -contains $vn) { continue }
        reg copy "HKU\RdpOld\Software\Microsoft\$vn" "HKU\RdpNew\Software\Microsoft\$vn" /s /f | Out-Null
       }
       [gc]::Collect(); [gc]::WaitForPendingFinalizers()
       Start-Sleep -Seconds 2
       reg unload HKU\RdpOld | Out-Null
       reg unload HKU\RdpNew | Out-Null
       Write-Host "Windows settings restore ho gayi."
      } else { Write-Host "Saved Windows settings abhi nahi hain, skip" }
     } catch { Write-Host "Settings restore fail: $_" }
     try {
      $wp = Get-ChildItem "C:\RDPData\wallpaper" -Filter "wall.*" -ErrorAction SilentlyContinue | Select-Object -First 1
      $hive = "$prof\NTUSER.DAT"
      if ($wp -and (Test-Path $hive)) {
       $style = "10"; $tile = "0"
       if (Test-Path "C:\RDPData\wallpaper\settings.json") {
        $j = Get-Content "C:\RDPData\wallpaper\settings.json" -Raw | ConvertFrom-Json
        if ($j.style) { $style = "$($j.style)" }
        if ($j.tile) { $tile = "$($j.tile)" }
       }
       reg load HKU\RdpWall "$hive" | Out-Null
       $k = "Registry::HKEY_USERS\RdpWall\Control Panel\Desktop"
       Set-ItemProperty -Path $k -Name Wallpaper -Value $wp.FullName
       Set-ItemProperty -Path $k -Name WallpaperStyle -Value $style
       Set-ItemProperty -Path $k -Name TileWallpaper -Value $tile
       [gc]::Collect(); [gc]::WaitForPendingFinalizers()
       Start-Sleep -Seconds 2
       reg unload HKU\RdpWall | Out-Null
       Write-Host "Wallpaper restore set: $($wp.FullName)"
      } else { Write-Host "Saved wallpaper abhi nahi hai, skip" }
     } catch { Write-Host "Wallpaper restore fail: $_" }
     exit 0
  - name: Hide Watermark and Add Snck Badge
    run: |
     $ErrorActionPreference = "Continue"
     try {
      $sid = (Get-LocalUser -Name $env:RDP_USER).SID.Value
      $prof = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid").ProfileImagePath
      $hive = "$prof\NTUSER.DAT"
      if (Test-Path $hive) {
       reg load HKU\RdpWM "$hive" | Out-Null
       $k = "Registry::HKEY_USERS\RdpWM\Control Panel\Desktop"
       Set-ItemProperty -Path $k -Name PaintDesktopVersion -Value 0 -Type DWord
       try {
        $k2 = "Registry::HKEY_USERS\RdpWM"
        Set-ItemProperty -Path $k -Name MenuShowDelay -Value "0" -Type String
        Set-ItemProperty -Path $k -Name UserPreferencesMask -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00)) -Type Binary
        foreach ($pair in @(
         @("$k2\Control Panel\Desktop\WindowMetrics", "MinAnimate", "0", "String"),
         @("$k2\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects", "VisualFXSetting", 2, "DWord"),
         @("$k2\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize", "EnableTransparency", 0, "DWord"),
         @("$k2\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced", "TaskbarAnimations", 0, "DWord"),
         @("$k2\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced", "ListviewAlphaSelect", 0, "DWord"),
         @("$k2\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced", "ListviewShadow", 0, "DWord"),
         @("$k2\Software\Microsoft\Windows\DWM", "EnableAeroPeek", 0, "DWord")
        )) {
         if (-not (Test-Path -LiteralPath $pair[0])) { New-Item -Path $pair[0] -Force | Out-Null }
         Set-ItemProperty -LiteralPath $pair[0] -Name $pair[1] -Value $pair[2] -Type $pair[3] -Force
        }
        Write-Host "Visual effects off (fast RDP) set."
       } catch { Write-Host "Visual effects tweak fail: $_" }
       [gc]::Collect(); [gc]::WaitForPendingFinalizers()
       Start-Sleep -Seconds 2
       reg unload HKU\RdpWM | Out-Null
       Write-Host "Windows Server version text hide set."
      }
     } catch { Write-Host "Watermark hide fail: $_" }
     @'
     $created = $false
     $mx = New-Object System.Threading.Mutex($true, "Local\SnckBadge", [ref]$created)
     if (-not $created) { exit }
     Add-Type -AssemblyName System.Windows.Forms
     Add-Type -AssemblyName System.Drawing
     Add-Type -ReferencedAssemblies System.Windows.Forms,System.Drawing -TypeDefinition @"
     using System;
     using System.Drawing;
     using System.Drawing.Drawing2D;
     using System.Drawing.Text;
     using System.Windows.Forms;
     public class BadgeForm : Form {
      System.Windows.Forms.Timer tm = new System.Windows.Forms.Timer();
      float t = 0;
      DateTime start = DateTime.Now;
      Image logo = null;
      public BadgeForm() {
       SetStyle(ControlStyles.AllPaintingInWmPaint | ControlStyles.UserPaint | ControlStyles.OptimizedDoubleBuffer, true);
       FormBorderStyle = FormBorderStyle.None;
       ShowInTaskbar = false;
       TopMost = true;
       StartPosition = FormStartPosition.Manual;
       Size = new Size(230, 62);
       BackColor = Color.FromArgb(12, 14, 22);
       Opacity = 0.99;
       Region = new Region(Round(new Rectangle(0, 0, Width, Height), 16));
       try {
        string lp = "C:\\ProgramData\\snck-assets\\logo.png";
        if (System.IO.File.Exists(lp)) {
         using (var fs = new System.IO.FileStream(lp, System.IO.FileMode.Open, System.IO.FileAccess.Read))
          logo = Image.FromStream(fs);
        }
       } catch { logo = null; }
       tm.Interval = 66;
       tm.Tick += delegate { t += 0.066f; Invalidate(); };
       tm.Start();
      }
      static GraphicsPath Round(Rectangle r, int d) {
       GraphicsPath p = new GraphicsPath();
       p.AddArc(r.X, r.Y, d, d, 180, 90);
       p.AddArc(r.Right - d, r.Y, d, d, 270, 90);
       p.AddArc(r.Right - d, r.Bottom - d, d, d, 0, 90);
       p.AddArc(r.X, r.Bottom - d, d, d, 90, 90);
       p.CloseFigure();
       return p;
      }
      protected override CreateParams CreateParams {
       get {
        CreateParams cp = base.CreateParams;
        cp.ExStyle |= 0x08000000 | 0x80 | 0x20 | 0x80000;
        return cp;
       }
      }
      protected override bool ShowWithoutActivation { get { return true; } }
      protected override void OnFormClosing(FormClosingEventArgs e) {
       if (e.CloseReason != CloseReason.WindowsShutDown) { e.Cancel = true; }
       base.OnFormClosing(e);
      }
      protected override void OnPaint(PaintEventArgs e) {
       Graphics g = e.Graphics;
       g.SmoothingMode = SmoothingMode.AntiAlias;
       g.TextRenderingHint = TextRenderingHint.AntiAliasGridFit;
       Rectangle rc = new Rectangle(0, 0, Width, Height);
       using (LinearGradientBrush bg = new LinearGradientBrush(rc, Color.FromArgb(16, 20, 34), Color.FromArgb(7, 9, 15), 45f))
        g.FillRectangle(bg, rc);
       // rotating gradient border
       using (LinearGradientBrush bb = new LinearGradientBrush(rc, Color.FromArgb(46, 204, 113), Color.FromArgb(0, 200, 255), (t * 70f) % 360f)) {
        ColorBlend cb = new ColorBlend(4);
        cb.Colors = new Color[] { Color.FromArgb(46, 204, 113), Color.FromArgb(0, 200, 255), Color.FromArgb(155, 89, 255), Color.FromArgb(46, 204, 113) };
        cb.Positions = new float[] { 0f, 0.33f, 0.66f, 1f };
        bb.InterpolationColors = cb;
        using (Pen bp = new Pen(bb, 3f))
        using (GraphicsPath bpath = Round(new Rectangle(2, 2, Width - 5, Height - 5), 14))
         g.DrawPath(bp, bpath);
       }
       // pulsing dot with expanding rings
       float cx = 19f, cy = Height / 2f;
       for (int k = 0; k < 3; k++) {
        float ph = (t * 0.7f + k / 3f) % 1f;
        float r = 5f + ph * 11f;
        int al = (int)((1f - ph) * 150f);
        using (Pen rp = new Pen(Color.FromArgb(al, 46, 204, 113), 1.5f))
         g.DrawEllipse(rp, cx - r, cy - r, 2 * r, 2 * r);
       }
       double pulse = 0.5 + 0.5 * Math.Sin(t * 4.0);
       int gr = 170 + (int)(pulse * 60);
       using (SolidBrush db = new SolidBrush(Color.FromArgb(40, gr, 100)))
        g.FillEllipse(db, cx - 5, cy - 5, 10, 10);
       // brand logo
       if (logo != null) { g.DrawImage(logo, 36, 11, 20, 20); }
       // shimmering title
       using (Font f1 = new Font("Segoe UI", 12, FontStyle.Bold))
       using (Font f2 = new Font("Segoe UI", 7, FontStyle.Regular)) {
        float period = 110f;
        using (LinearGradientBrush tb = new LinearGradientBrush(new RectangleF(0, 0, period, 10), Color.FromArgb(46, 204, 113), Color.White, 0f)) {
         ColorBlend tc = new ColorBlend(3);
         tc.Colors = new Color[] { Color.FromArgb(46, 204, 113), Color.White, Color.FromArgb(46, 204, 113) };
         tc.Positions = new float[] { 0f, 0.5f, 1f };
         tb.InterpolationColors = tc;
         tb.WrapMode = WrapMode.Tile;
         tb.TranslateTransform((t * 120f) % period, 0);
         g.DrawString("SNCK RDP", f1, tb, 60, 6);
        }
        TimeSpan up = DateTime.Now - start;
        string sub = "ONLINE  " + string.Format("{0:00}:{1:00}:{2:00}", (int)up.TotalHours, up.Minutes, up.Seconds);
        using (SolidBrush sb = new SolidBrush(Color.FromArgb(160, 175, 195)))
         g.DrawString(sub, f2, sb, 62, 32);
       }
       // bouncing bars
       for (int i = 0; i < 4; i++) {
        float h = 5f + 14f * (float)(0.5 + 0.5 * Math.Sin(t * 5.0 + i * 1.3));
        using (SolidBrush bs = new SolidBrush(Color.FromArgb(200, 46, 204, 113)))
         g.FillRectangle(bs, Width - 34 + i * 7, Height / 2f + 10 - h, 4, h);
       }
      }
     }
     "@
     [System.Windows.Forms.Application]::EnableVisualStyles()
     $f = New-Object BadgeForm
     function Place {
      $wa = [System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea
      $f.Location = New-Object System.Drawing.Point(($wa.Right - $f.Width - 12), ($wa.Bottom - $f.Height - 12))
      $f.TopMost = $true
     }
     Place
     $t = New-Object System.Windows.Forms.Timer
     $t.Interval = 15000
     $t.Add_Tick({ Place })
     $t.Start()
     [System.Windows.Forms.Application]::Run($f)
     '@ | Set-Content -Path "C:\ProgramData\snck-badge.ps1" -Encoding UTF8
     @'
     CreateObject("WScript.Shell").Run "powershell.exe -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File ""C:\ProgramData\snck-badge.ps1""", 0, False
     '@ | Set-Content -Path "C:\ProgramData\snck-badge.vbs" -Encoding ASCII
     Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" -Name "SnckBadge" -Value 'wscript.exe "C:\ProgramData\snck-badge.vbs"'
