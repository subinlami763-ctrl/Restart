name: snck

on:
 workflow_dispatch:
  inputs:
   reset_apps:
    description: "Saved installed apps delete karke fresh Windows se shuru"
    type: boolean
    default: false

permissions:
 contents: write

# Naya run tab tak wait kare jab tak purana run apna Final Save pura na kar le
concurrency:
 group: snck-rdp
 cancel-in-progress: false

jobs:
 secure-rdp:
  runs-on: windows-latest
  timeout-minutes: 360
  env:
   GH_TOKEN: ${{ github.token }}
   RDP_USER: snck
   RDP_PASS: "snck"
   RESET_APPS: ${{ inputs.reset_apps }}
   TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}

  steps:
  - name: Record Job Start Time
    run: |
     echo "JOB_START_UTC=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV
  - name: Checkout (Snck assets)
    uses: actions/checkout@v4
  - name: Stage Snck Assets (logo + wallpaper)
    run: |
     $ErrorActionPreference = "Continue"
     New-Item -ItemType Directory -Force -Path "C:\ProgramData\snck-assets" | Out-Null
     if (Test-Path "assets\snck-logo.png") {
      Copy-Item "assets\snck-logo.png" "C:\ProgramData\snck-assets\logo.png" -Force
      Write-Host "Snck logo staged."
     } else { Write-Host "assets\snck-logo.png repo me nahi mila, badge bina logo ke chalega." }
     if (Test-Path "assets\snck-wallpaper.jpg") {
      Copy-Item "assets\snck-wallpaper.jpg" "C:\ProgramData\snck-assets\wall-seed.jpg" -Force
      Write-Host "Snck wallpaper seed staged (restore ke baad, sirf pehli baar apply hoga)."
     } else { Write-Host "assets\snck-wallpaper.jpg repo me nahi mila." }
     exit 0
  - name: Restore Saved Data
    run: |
     $dir  = "C:\RDPData"
     $repo = $env:GITHUB_REPOSITORY
     $tar  = "$env:SystemRoot\System32\tar.exe"
     @'
     $ErrorActionPreference = "Continue"
     function Get-AssetNames {
      try { return @(gh release view rdp-data --repo $env:GITHUB_REPOSITORY --json assets -q ".assets[].name" 2>$null) } catch { return @() }
     }
     function Remove-Asset($n) {
      gh release delete-asset rdp-data $n --repo $env:GITHUB_REPOSITORY --yes 2>&1 | Out-Null
     }
     function Split-File($file, $prefix, [long]$size) {
      $in = [IO.File]::OpenRead($file)
      $buf = New-Object byte[] (4MB)
      $i = 0
      $names = @()
      while ($in.Position -lt $in.Length) {
       $i++
       $pn = "{0}.part{1:D3}" -f $prefix, $i
       $o = [IO.File]::Create($pn)
       [long]$written = 0
       while ($written -lt $size -and $in.Position -lt $in.Length) {
        $want = [int][Math]::Min([long]$buf.Length, [long]($size - $written))
        $n = $in.Read($buf, 0, $want)
        if ($n -le 0) { break }
        $o.Write($buf, 0, $n)
        $written += $n
       }
       $o.Close()
       $names += $pn
      }
      $in.Close()
      return $names
     }
     function Save-Archive($name, $baseDir, $sources, $excludes) {
      $tar = "$env:SystemRoot\System32\tar.exe"
      $d = "$env:TEMP\save"
      New-Item -ItemType Directory -Force -Path $d | Out-Null
      $f = "$d\$name"
      Remove-Item $f -Force -ErrorAction SilentlyContinue
      Get-ChildItem $d -Filter "$name.part*" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
      $a = @("-czf", $f) + @($excludes) + @("-C", $baseDir) + @($sources)
      & $tar @a
      if (-not (Test-Path $f)) { Write-Host "$name ban hi nahi paya"; return }
      $len = (Get-Item $f).Length
      $mb = [math]::Round($len / 1MB)
      $existing = @(Get-AssetNames)
      if ($len -le 1800MB) {
       gh release upload rdp-data $f --repo $env:GITHUB_REPOSITORY --clobber
       if ($LASTEXITCODE -ne 0) { Write-Host "$name upload fail"; Remove-Item $f -Force -ErrorAction SilentlyContinue; return }
       foreach ($n in $existing) { if ($n -like "$name.part*") { Remove-Asset $n } }
       Write-Host "[$(Get-Date)] $name saved ($mb MB)"
      } else {
       $parts = @(Split-File $f "$d\$name" ([long]1800MB))
       $ok = $true
       foreach ($p in $parts) {
        gh release upload rdp-data $p --repo $env:GITHUB_REPOSITORY --clobber
        if ($LASTEXITCODE -ne 0) { $ok = $false; break }
       }
       if ($ok) {
        $keep = @($parts | ForEach-Object { Split-Path $_ -Leaf })
        foreach ($n in $existing) {
         if ($n -eq $name -or ($n -like "$name.part*" -and $keep -notcontains $n)) { Remove-Asset $n }
        }
        Write-Host "[$(Get-Date)] $name saved in $($parts.Count) parts ($mb MB)"
       } else { Write-Host "$name part upload fail, purana saved rakha" }
       foreach ($p in $parts) { Remove-Item $p -Force -ErrorAction SilentlyContinue }
      }
      Remove-Item $f -Force -ErrorAction SilentlyContinue
     }
     function Restore-Archive($name, $dest) {
      $tar = "$env:SystemRoot\System32\tar.exe"
      $t = $env:TEMP
      Remove-Item "$t\$name" -Force -ErrorAction SilentlyContinue
      Get-ChildItem $t -Filter "$name.part*" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
      gh release download rdp-data --repo $env:GITHUB_REPOSITORY --pattern $name --dir $t --clobber 2>$null
      if (-not (Test-Path "$t\$name")) {
       gh release download rdp-data --repo $env:GITHUB_REPOSITORY --pattern "$name.part*" --dir $t --clobber 2>$null
       $parts = @(Get-ChildItem $t -Filter "$name.part*" -ErrorAction SilentlyContinue | Sort-Object Name)
       if ($parts.Count -gt 0) {
        $out = [IO.File]::Create("$t\$name")
        foreach ($p in $parts) {
         $in = [IO.File]::OpenRead($p.FullName)
         $in.CopyTo($out)
         $in.Close()
         Remove-Item $p.FullName -Force -ErrorAction SilentlyContinue
        }
        $out.Close()
       }
      }
      if (Test-Path "$t\$name") {
       New-Item -ItemType Directory -Force -Path $dest | Out-Null
       & $tar -xzf "$t\$name" -C $dest
       Remove-Item "$t\$name" -Force -ErrorAction SilentlyContinue
       return $true
      }
      return $false
     }
     function Get-AppSig($base, $src) {
      $cnt = 0; $sum = [long]0; $mx = [long]0
      foreach ($s in @($src)) {
       $p = Join-Path $base ($s -replace '/', '\')
       if (-not (Test-Path -LiteralPath $p)) { continue }
       foreach ($f in @(Get-ChildItem -LiteralPath $p -Recurse -File -Force -ErrorAction SilentlyContinue)) {
        if ($f.FullName -match '(?i)cache|crashpad|\\logs\\') { continue }
        $cnt++
        $sum += $f.Length
        $t = $f.LastWriteTimeUtc.Ticks
        if ($t -gt $mx) { $mx = $t }
       }
      }
      return "$cnt|$sum|$mx"
     }
     function Save-AppArchives($prof, [switch]$SigOnly) {
      $exApp = @(
       "--exclude=*Cache*", "--exclude=*cache*", "--exclude=Crashpad", "--exclude=GrShaderCache", "--exclude=ShaderCache",
       "--exclude=AppData/Local/Google/Chrome",
       "--exclude=AppData/Local/BraveSoftware",
       "--exclude=AppData/Local/Microsoft/Windows",
       "--exclude=AppData/Local/Microsoft/WindowsApps",
       "--exclude=AppData/Roaming/Microsoft/Windows",
       "--exclude=AppData/Roaming/.minecraft/assets",
       "--exclude=AppData/Roaming/.minecraft/libraries",
       "--exclude=AppData/Roaming/.minecraft/runtime",
       "--exclude=AppData/Roaming/.minecraft/logs",
       "--exclude=AppData/Roaming/.minecraft/webcache"
      )
      $sd = "C:\app-sigs"
      New-Item -ItemType Directory -Force -Path $sd | Out-Null
      $groups = @(
       @{ pre = "al"; rel = "AppData/Local"; skip = @("Temp", "Packages", "CrashDumps", "D3DSCache", "PeerDistRepub", "VirtualStore", "ConnectedDevices", "History", "Application Data", "Temporary Internet Files", "INetCache") },
       @{ pre = "ar"; rel = "AppData/Roaming"; skip = @() },
       @{ pre = "ao"; rel = "AppData/LocalLow"; skip = @() }
      )
      foreach ($g in $groups) {
       $root = Join-Path $prof ($g.rel -replace '/', '\')
       if (-not (Test-Path -LiteralPath $root)) { continue }
       $items = @(Get-ChildItem -LiteralPath $root -Force -ErrorAction SilentlyContinue | Where-Object {
        -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -and ($g.skip -notcontains $_.Name)
       })
       foreach ($it in $items) {
        $src = "$($g.rel)/$($it.Name)"
        $name = "$($g.pre)-" + ($it.Name -replace '[^A-Za-z0-9_-]', '_') + ".tgz"
        $sig = Get-AppSig $prof @($src)
        $sf = "$sd\$name.sig"
        if ($SigOnly) { Set-Content -Path $sf -Value $sig -NoNewline; continue }
        if ($sig -eq "0|0|0") { continue }
        if ((Test-Path $sf) -and ((Get-Content $sf -Raw).Trim() -eq $sig)) { continue }
        Save-Archive $name $prof @($src) $exApp
        $have = @(Get-AssetNames | Where-Object { $_ -eq $name -or $_ -like "$name.part*" })
        if ($have.Count -gt 0) { Set-Content -Path $sf -Value $sig -NoNewline }
        else { Write-Host "$name save nahi hua, agli baar phir try hoga" }
       }
      }
     }
     '@ | Set-Content -Path "C:\persist-lib.ps1"
     . "C:\persist-lib.ps1"
     New-Item -ItemType Directory -Force -Path $dir | Out-Null
     foreach ($f in "Desktop","Documents","Downloads","Pictures","Videos","Music") {
      New-Item -ItemType Directory -Force -Path "$dir\$f" | Out-Null
     }
     @'
     $ErrorActionPreference = "Continue"
     . "C:\persist-lib.ps1"
     $prof = $null
     $sid = $null
     try {
      $sid = (Get-LocalUser -Name $env:RDP_USER).SID.Value
      $prof = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid").ProfileImagePath
     } catch {}
     if (-not $prof) { $prof = "C:\Users\$env:RDP_USER" }
     Write-Host "Profile path: $prof"
     if (Test-Path "C:\save-apps.ps1") { & "C:\save-apps.ps1" }
     try {
      $wpDir = "C:\RDPData\wallpaper"
      New-Item -ItemType Directory -Force -Path $wpDir | Out-Null
      $cur = $null; $style = "10"; $tile = "0"
      if ($sid) {
       $hk = "Registry::HKEY_USERS\$sid\Control Panel\Desktop"
       if (Test-Path $hk) {
        $dp = Get-ItemProperty $hk
        $cur = $dp.Wallpaper
        if ($dp.WallpaperStyle) { $style = "$($dp.WallpaperStyle)" }
        if ($dp.TileWallpaper) { $tile = "$($dp.TileWallpaper)" }
       }
      }
      if (-not $cur -or -not (Test-Path $cur)) { $cur = "$prof\AppData\Roaming\Microsoft\Windows\Themes\TranscodedWallpaper" }
      if (Test-Path $cur) {
       $ext = [IO.Path]::GetExtension($cur); if (-not $ext) { $ext = ".jpg" }
       $dest = "$wpDir\wall$ext"
       if ($cur -ne $dest) {
        Get-ChildItem $wpDir -Filter "wall.*" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
        Copy-Item $cur $dest -Force
       }
       @{ style = $style; tile = $tile } | ConvertTo-Json | Set-Content "$wpDir\settings.json"
       Write-Host "Wallpaper saved: $cur"
      } else { Write-Host "Wallpaper file nahi mili, purana saved wallpaper rakha" }
     } catch { Write-Host "Wallpaper save fail: $_" }
     try {
      $hiv = "$env:TEMP\settings.hiv"
      Remove-Item $hiv -Force -ErrorAction SilentlyContinue
      if ($sid -and (Test-Path "Registry::HKEY_USERS\$sid")) {
       reg save "HKU\$sid" $hiv /y | Out-Null
      } elseif (Test-Path "$prof\NTUSER.DAT") {
       Copy-Item "$prof\NTUSER.DAT" $hiv -Force -ErrorAction SilentlyContinue
      }
      if (Test-Path $hiv) {
       gh release upload rdp-data $hiv --repo $env:GITHUB_REPOSITORY --clobber
       Write-Host "[$(Get-Date)] Windows settings saved"
      } else { Write-Host "Settings hive nahi bana, purana saved rakha" }
     } catch { Write-Host "Settings save fail: $_" }
     if (Test-Path "C:\save-ts.ps1") { & "C:\save-ts.ps1" }
     try {
      $ms = "$env:TEMP\machstage"
      Remove-Item $ms -Recurse -Force -ErrorAction SilentlyContinue
      New-Item -ItemType Directory -Force -Path "$ms\mach" | Out-Null
      $mkeys = @(
       "HKLM\SYSTEM\CurrentControlSet\Control\TimeZoneInformation",
       "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp",
       "HKLM\SOFTWARE\Policies",
       "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies"
      )
      $mi = 0
      foreach ($mk in $mkeys) { $mi++; reg export $mk "$ms\mach\k$mi.reg" /y 2>&1 | Out-Null }
      Save-Archive "machine.tgz" $ms @("mach") @()
     } catch { Write-Host "machine settings save fail: $_" }
     Save-Archive "data.tgz" "C:\RDPData" @(".") @()
     # PEHLE apps (Discord etc.) save hote hain, har app ka alag chhota archive, sirf changed wale
     try { Save-AppArchives $prof } catch { Write-Host "App archives save fail: $_" }
     $exB = @("--exclude=*Cache*", "--exclude=*cache*", "--exclude=Crashpad", "--exclude=GrShaderCache", "--exclude=ShaderCache")
     $browsers = @(
      @{ n = "chrome.tgz";  p = @("AppData/Local/Google/Chrome") },
      @{ n = "brave.tgz";   p = @("AppData/Local/BraveSoftware") },
      @{ n = "shell.tgz";   p = @("AppData/Roaming/Microsoft/Windows/Start Menu", "AppData/Roaming/Microsoft/Windows/Themes", "AppData/Roaming/Microsoft/Windows/SendTo", "AppData/Roaming/Microsoft/Windows/Libraries", "AppData/Roaming/Microsoft/Windows/Templates", "AppData/Roaming/Microsoft/Internet Explorer/Quick Launch") },
      @{ n = "fonts.tgz";   p = @("AppData/Local/Microsoft/Windows/Fonts") }
     )
     foreach ($b in $browsers) {
      $have = @($b.p | Where-Object { Test-Path -LiteralPath ("$prof\" + ($_ -replace "/", "\")) })
      if ($have.Count -gt 0) { Save-Archive $b.n $prof $have $exB }
      else { Write-Host "$($b.n): data nahi mila, skip" }
     }
     $skipRoot = @("AppData", "Desktop", "Documents", "Downloads", "Pictures", "Videos", "Music", "OneDrive", "Application Data", "Local Settings", "My Documents", "Cookies", "NetHood", "PrintHood", "Recent", "SendTo", "Start Menu", "Templates")
     $rootItems = @(Get-ChildItem $prof -Force -ErrorAction SilentlyContinue | Where-Object {
      -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -and ($skipRoot -notcontains $_.Name) -and ($_.Name -notlike "NTUSER*") -and ($_.Name -notlike "ntuser*")
     } | ForEach-Object { $_.Name })
     if ($rootItems.Count -gt 0) { Save-Archive "profile.tgz" $prof $rootItems @("--exclude=*Cache*", "--exclude=*cache*") }
     exit 0
     '@ | Set-Content -Path "C:\save-data.ps1"
     @'
     $ErrorActionPreference = "Continue"
     try {
      $tsDir = "$env:ProgramData\Tailscale"
      if (-not (Test-Path "$tsDir\server-state.conf")) { Write-Host "Tailscale state file nahi mili, save skip"; exit 0 }
      $stage = "$env:TEMP\tsstage"
      Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
      New-Item -ItemType Directory -Force -Path "$stage\Tailscale" | Out-Null
      Get-ChildItem $tsDir -File -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName "$stage\Tailscale\" -Force -ErrorAction SilentlyContinue }
      if (-not (Test-Path "$stage\Tailscale\server-state.conf")) { Write-Host "Tailscale state copy nahi hui, save skip"; exit 0 }
      $f = "$env:TEMP\tailscale-state.tgz"
      Remove-Item $f -Force -ErrorAction SilentlyContinue
      & "$env:SystemRoot\System32\tar.exe" -czf $f -C $stage Tailscale
      gh release upload rdp-data $f --repo $env:GITHUB_REPOSITORY --clobber
      Write-Host "[$(Get-Date)] Tailscale state saved"
     } catch { Write-Host "Tailscale state save fail: $_" }
     exit 0
     '@ | Set-Content -Path "C:\save-ts.ps1"
     reg load HKU\DefTmp "C:\Users\Default\NTUSER.DAT" | Out-Null
     $k = "Registry::HKEY_USERS\DefTmp\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders"
     if (-not (Test-Path $k)) { New-Item -Path $k -Force | Out-Null }
     $map = @{
      "Desktop" = "Desktop"
      "Personal" = "Documents"
      "{374DE290-123F-4565-9164-39C4925E467B}" = "Downloads"
      "My Pictures" = "Pictures"
      "My Video" = "Videos"
      "My Music" = "Music"
     }
     foreach ($n in $map.Keys) {
      Set-ItemProperty -Path $k -Name $n -Value "$dir\$($map[$n])" -Type ExpandString
     }
     [gc]::Collect(); [gc]::WaitForPendingFinalizers()
     Start-Sleep -Seconds 2
     reg unload HKU\DefTmp | Out-Null
     gh release view rdp-data --repo $repo *> $null
     if ($LASTEXITCODE -ne 0) {
      gh release create rdp-data --repo $repo --title "RDP data" --notes "Saved RDP data. Delete mat karna."
      Write-Host "Pehli baar run hai, purana data nahi hai."
     } else {
      if (Restore-Archive "data.tgz" $dir) {
       Write-Host "Purana data restore ho gaya."
      } else {
       gh release download rdp-data --repo $repo --pattern data.zip --dir $env:TEMP --clobber
       if (Test-Path "$env:TEMP\data.zip") {
        Expand-Archive "$env:TEMP\data.zip" -DestinationPath $dir -Force
        Write-Host "Purana data.zip restore ho gaya."
       } else {
        Write-Host "Abhi tak koi data save nahi hua."
       }
      }
     }
     # Wallpaper seed: restore ke BAAD check hota hai, taaki user ka saved wallpaper (png etc.) kabhi overwrite na ho
     $wpDir = "C:\RDPData\wallpaper"
     New-Item -ItemType Directory -Force -Path $wpDir | Out-Null
     $hasSaved = @(Get-ChildItem $wpDir -Filter "wall.*" -ErrorAction SilentlyContinue).Count -gt 0
     $seed = "C:\ProgramData\snck-assets\wall-seed.jpg"
     if (-not $hasSaved -and (Test-Path $seed)) {
      Copy-Item $seed "$wpDir\wall.jpg" -Force
      @{ style = "10"; tile = "0" } | ConvertTo-Json | Set-Content "$wpDir\settings.json"
      Write-Host "Snck wallpaper seeded (pehli baar ke liye, agli baar jo wallpaper set hoga wahi save/restore hoga)."
     } else { Write-Host "Wallpaper seed skip (pehle se saved hai ya asset nahi mila)." }
     exit 0
  - name: Restore Machine Settings
    run: |
     . "C:\persist-lib.ps1"
     $t = "$env:TEMP\mach-restore"
     Remove-Item $t -Recurse -Force -ErrorAction SilentlyContinue
     if (Restore-Archive "machine.tgz" $t) {
      foreach ($r in @(Get-ChildItem "$t\mach" -Filter "*.reg" -ErrorAction SilentlyContinue)) {
       reg import $r.FullName 2>&1 | Out-Null
      }
      Write-Host "Machine settings restore ho gayi."
     } else { Write-Host "Machine settings abhi tak save nahi hui." }
     exit 0
  - name: Fresh Windows Cleanup
    run: |
     . "C:\persist-lib.ps1"
     $names = @(Get-AssetNames)
     if (($names -notcontains "fresh-v2.flag") -or ($env:RESET_APPS -eq "true")) {
      Write-Host "Purane saved apps (VS Code/Antigravity etc.) clear kar rahe hain"
      foreach ($n in $names) { if ($n -like "apps-files*" -or $n -like "apps-meta*") { Remove-Asset $n } }
      Set-Content -Path "$env:TEMP\fresh-v2.flag" -Value "ok" -NoNewline
      gh release upload rdp-data "$env:TEMP\fresh-v2.flag" --repo $env:GITHUB_REPOSITORY --clobber
     }
     foreach ($d in "C:\RDPData\Desktop", "C:\Users\Public\Desktop") {
      foreach ($pat in "Visual Studio Code*", "Antigravity*", "Codex*", "ChatGPT*", "Microsoft Edge*", "Firefox*") {
       Get-ChildItem $d -Filter "$pat.lnk" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
      }
     }
     @'
     $ErrorActionPreference = "Continue"
     $procs = @()
     $ff = "C:\Program Files\Mozilla Firefox\uninstall\helper.exe"
     if (Test-Path $ff) { $procs += Start-Process $ff -ArgumentList "/S" -PassThru }
     $vs = "C:\Program Files\Microsoft VS Code\unins000.exe"
     if (Test-Path $vs) { $procs += Start-Process $vs -ArgumentList "/VERYSILENT", "/NORESTART", "/SUPPRESSMSGBOXES" -PassThru }
     $edge = Get-ChildItem "C:\Program Files (x86)\Microsoft\Edge\Application" -Directory -ErrorAction SilentlyContinue |
      Where-Object { $_.Name -match '^\d' } |
      ForEach-Object { Join-Path $_.FullName "Installer\setup.exe" } |
      Where-Object { Test-Path $_ } | Select-Object -First 1
     if ($edge) { $procs += Start-Process $edge -ArgumentList "--uninstall", "--system-level", "--verbose-logging", "--force-uninstall" -PassThru }
     foreach ($p in $procs) { if (-not $p.WaitForExit(120000)) { try { $p.Kill() } catch {} } }
     $sm = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs"
     foreach ($pat in "Firefox*", "Microsoft Edge*") { Get-ChildItem $sm -Filter "$pat.lnk" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue }
     Remove-Item "$sm\Visual Studio Code" -Recurse -Force -ErrorAction SilentlyContinue
     Set-Content -Path "C:\cleanup.done" -Value "ok"
     '@ | Set-Content -Path "C:\fresh-cleanup.ps1"
     Remove-Item "C:\cleanup.done" -Force -ErrorAction SilentlyContinue
     Start-Process powershell.exe -WindowStyle Hidden -ArgumentList "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "C:\fresh-cleanup.ps1"
     Write-Host "Cleanup background me shuru (Firefox/Edge/VS Code uninstall)."
     exit 0
  - name: Configure Core RDP Settings
    run: |
     Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
         -Name "fDenyTSConnections" -Value 0 -Force
     Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
         -Name "UserAuthentication" -Value 0 -Force
     Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
         -Name "SecurityLayer" -Value 0 -Force
     netsh advfirewall firewall delete rule name="RDP-Tailscale"
     netsh advfirewall firewall add rule name="RDP-Tailscale" `
     dir=in action=allow protocol=TCP localport=3389 profile=any
     $tsp = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
     New-Item -Path $tsp -Force | Out-Null
     $pol = @{
      "fClientDisableUDP" = 0
      "SelectTransport" = 0
      "VGOptimization_CaptureFrameRate" = 2
      "AVC444ModePreferred" = 0
      "AVCHardwareEncodePreferred" = 1
      "bEnumerateHWBeforeSW" = 1
      "fEnableVirtualizedGraphics" = 1
      "fDisableCompression" = 0
      "MaxCompressionLevel" = 2
      "fEnableLossyCompression" = 1
      "ImageQuality" = 2
      "fEnableSuperPan" = 1
     }
     foreach ($name in $pol.Keys) {
      Set-ItemProperty -Path $tsp -Name $name -Value $pol[$name] -Type DWord -Force
     }
     Restart-Service -Name TermService -Force
  - name: Performance Boost
    run: |
     $ErrorActionPreference = "Continue"
     Write-Host "RAM: $([math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)) GB, CPU cores: $((Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors)"
     try { powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>&1 | Out-Null; Write-Host "High performance power plan on" } catch {}
     try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue; Write-Host "Defender realtime off" } catch {}
     foreach ($svc in "SysMain", "WSearch", "DiagTrack", "wuauserv", "UsoSvc") {
      try { Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue; Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue } catch {}
     }
     try {
